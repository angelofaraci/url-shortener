apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: url-shortener
  labels:
    app.kubernetes.io/name: url-shortener
data:
  PORT: "3000"
  NODE_ENV: "production"
  REDIS_URL: "redis://redis:6379"
  CORS_ORIGIN: "http://app.url-shortener.local"
  DEFAULT_CACHE_TTL_SECONDS: "3600"
  SHORT_CODE_LENGTH: "6"
  APP_BASE_URL: "http://app.url-shortener.local"
  SESSION_TTL_SECONDS: "604800"
  SESSION_COOKIE_NAME: "sid"
  ANON_LINK_TTL_HOURS: "24"
  ANON_CLEANUP_ENABLED: "false"
  ANON_CLEANUP_INTERVAL_MINUTES: "60"
