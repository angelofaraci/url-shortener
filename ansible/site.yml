---
- name: Converge the url-shortener EC2 host
  hosts: all
  become: true
  gather_facts: true

  # Role order matters: common prepares the host, params decrypts secrets
  # and writes .env, proxy renders nginx.conf, app brings the Compose stack
  # up (picking up both files), tailscale joins the tailnet last since it
  # has no dependency on the app stack being healthy.
  roles:
    - common
    - params
    - proxy

  tasks:
    # Flush proxy's nginx-restart handler before app converges, so a
    # mid-play failure in app (e.g. an ECR-related step) never leaves the
    # templated nginx config un-reloaded/inconsistent with running state.
    - name: Flush handlers
      ansible.builtin.meta: flush_handlers

    - name: Converge the app role
      ansible.builtin.include_role:
        name: app

    - name: Converge the tailscale role
      ansible.builtin.include_role:
        name: tailscale
