---
project_name: url-shortener
aws_region: us-east-1
app_dir: /opt/app
compose_file: docker-compose.prod.yml

# PR4 resolution: terraform/security.tf's aws_iam_role_policy.instance_secrets
# now also grants the instance role read-only ssm:GetParameter* on
# config/* (no kms:Decrypt needed, config/* is a plain String). The
# `params` role reads /url-shortener/config/public_base_url at convergence
# time into params_cors_origin (ansible-lint's var-naming rule requires
# the role prefix); env.j2 falls back to this placeholder only if that
# SSM read task is ever skipped or fails.
cors_origin: "*"
