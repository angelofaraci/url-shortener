server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # react-router uses client-side (BrowserRouter) history routing, so any
    # path nginx doesn't have a static file for must still serve index.html
    # instead of a 404 — the router resolves the path in the browser.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
